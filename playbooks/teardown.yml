---
- name: Teardown AWS foundation for OpenShift (safe destroy)
  hosts: localhost
  connection: local
  gather_facts: false

  # -----------------------------------------------------------------------------
  # Safety model (two-step)
  # 1) confirm_destroy=true (explicit operator intent)
  # 2) typed confirmation must match the VPC ID (prevents accidental fat-finger)
  #
  # Scope
  # This teardown targets resources created by this role, identified primarily via:
  # - VPC Name tag = vpc_name
  # - Route table Name tags = {{ project_name }}-rtb-public/private
  # - NAT Name tag = nat_gateway_name
  # -----------------------------------------------------------------------------

  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"

  pre_tasks:
    - name: Safety check - require confirm_destroy=true
      ansible.builtin.fail:
        msg: >
          Refusing to run teardown because confirm_destroy is not true.
          Set confirm_destroy: true in group_vars/all.yml or pass -e confirm_destroy=true
      when: not (confirm_destroy | bool)

  tasks:
    # ---------------------------------------------------------------------------
    # Discover the VPC by Name tag (our anchor)
    # ---------------------------------------------------------------------------
    - name: Lookup VPC by Name tag
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "{{ vpc_name }}"
      register: vpc_info

    - name: Fail if VPC not found (nothing to teardown)
      ansible.builtin.fail:
        msg: "VPC with tag Name={{ vpc_name }} not found in {{ aws_region }}."
      when: (vpc_info.vpcs | length) == 0

    - name: Set vpc_id fact
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"

    # ---------------------------------------------------------------------------
    # Gather subnets in VPC (for plan + deletion)
    # ---------------------------------------------------------------------------
    - name: Gather subnets in VPC
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnet_info

    - name: Set subnet id lists
      ansible.builtin.set_fact:
        subnet_ids: "{{ subnet_info.subnets | map(attribute='subnet_id') | list }}"

    # ---------------------------------------------------------------------------
    # Gather route tables by Name tags we created
    # ---------------------------------------------------------------------------
    - name: Gather public route tables by Name tag
      amazon.aws.ec2_vpc_route_table_info:
        filters:
          vpc-id: "{{ vpc_id }}"
          "tag:Name": "{{ project_name }}-rtb-public"
      register: rtb_public_info

    - name: Gather private route tables by Name tag
      amazon.aws.ec2_vpc_route_table_info:
        filters:
          vpc-id: "{{ vpc_id }}"
          "tag:Name": "{{ project_name }}-rtb-private"
      register: rtb_private_info

    - name: Combine route table ids
      ansible.builtin.set_fact:
        route_table_ids: >-
          {{
            (rtb_public_info.route_tables | map(attribute='id') | list)
            +
            (rtb_private_info.route_tables | map(attribute='id') | list)
          }}

    # ---------------------------------------------------------------------------
    # Gather NAT gateways created by THIS project (tag-scoped)
    # ---------------------------------------------------------------------------
    - name: Gather NAT gateways in VPC with Name tag matching nat_gateway_name
      amazon.aws.ec2_vpc_nat_gateway_info:
        filters:
          vpc-id: "{{ vpc_id }}"
          "tag:Name": "{{ nat_gateway_name }}"
      register: natgw_info

    - name: Extract NAT gateway ids
      ansible.builtin.set_fact:
        nat_gateway_ids: "{{ natgw_info.result | map(attribute='nat_gateway_id') | list }}"
      when: natgw_info.result is defined

    - name: Extract EIP allocation ids from NAT gateways (if any)
      ansible.builtin.set_fact:
        nat_eip_allocation_ids: >-
          {{
            natgw_info.result
            | map(attribute='nat_gateway_addresses') | list
            | flatten
            | selectattr('allocation_id', 'defined')
            | map(attribute='allocation_id')
            | list
          }}
      when: natgw_info.result is defined

    # ---------------------------------------------------------------------------
    # SAFE LIST + TYPED CONFIRMATION
    # ---------------------------------------------------------------------------
    - name: Gather internet gateways attached to VPC (for plan)
      amazon.aws.ec2_vpc_igw_info:
        filters:
          attachment.vpc-id: "{{ vpc_id }}"
      register: igw_info_plan

    - name: Build safe-delete plan
      ansible.builtin.set_fact:
        teardown_plan:
          project_name: "{{ project_name }}"
          vpc_name: "{{ vpc_name }}"
          vpc_id: "{{ vpc_id }}"
          region: "{{ aws_region }}"
          nat_gateway_ids: "{{ nat_gateway_ids | default([]) }}"
          nat_eip_allocation_ids: "{{ nat_eip_allocation_ids | default([]) }}"
          route_table_ids: "{{ route_table_ids | default([]) }}"
          subnet_ids: "{{ subnet_ids | default([]) }}"
          internet_gateway_ids: "{{ igw_info_plan.internet_gateways | default([]) | map(attribute='internet_gateway_id') | list }}"
          delete_security_groups: "{{ delete_security_groups | default(true) }}"
          security_groups:
            - "{{ sg_nodes_name }}"
            - "{{ sg_bastion_name }}"
          delete_keypair: "{{ delete_keypair | default(false) }}"
          keypair_name: "{{ ec2_keypair_name }}"
          delete_route53_zone_on_teardown: "{{ delete_route53_zone_on_teardown | default(false) }}"
          route53_zone_name: "{{ route53_zone_name }}"

    - name: Print SAFE DELETE PLAN (copy/paste confirmation value from here)
      ansible.builtin.debug:
        msg:
          - "================ SAFE DELETE PLAN ================"
          - "Project: {{ teardown_plan.project_name }}"
          - "Region:  {{ teardown_plan.region }}"
          - "VPC:     {{ teardown_plan.vpc_name }} ({{ teardown_plan.vpc_id }})"
          - "NATs:    {{ teardown_plan.nat_gateway_ids }}"
          - "NAT EIPs:{{ teardown_plan.nat_eip_allocation_ids }}"
          - "RTBs:    {{ teardown_plan.route_table_ids }}"
          - "Subnets: {{ teardown_plan.subnet_ids }}"
          - "IGWs:    {{ teardown_plan.internet_gateway_ids }}"
          - "SGs:     {{ teardown_plan.delete_security_groups }} ({{ teardown_plan.security_groups }})"
          - "Keypair: {{ teardown_plan.delete_keypair }} ({{ teardown_plan.keypair_name }})"
          - "R53:     {{ teardown_plan.delete_route53_zone_on_teardown }} ({{ teardown_plan.route53_zone_name }})"
          - "--------------------------------------------------"
          - "To continue, type the VPC ID exactly: {{ teardown_plan.vpc_id }}"
          - "=================================================="

    - name: Prompt for typed confirmation (must match VPC ID)
      ansible.builtin.pause:
        prompt: "Type the VPC ID to confirm deletion (exactly): {{ vpc_id }}"
      register: typed_confirm
      when: require_typed_confirmation | bool

    - name: Fail if typed confirmation does not match
      ansible.builtin.fail:
        msg: "Confirmation mismatch. You typed '{{ typed_confirm.user_input }}' but expected '{{ vpc_id }}'. Aborting."
      when:
        - require_typed_confirmation | bool
        - typed_confirm.user_input != vpc_id

    # ---------------------------------------------------------------------------
    # Delete NAT gateways FIRST (stops hourly $)
    # ---------------------------------------------------------------------------
    - name: Delete NAT gateways (if present)
      amazon.aws.ec2_vpc_nat_gateway:
        state: absent
        nat_gateway_id: "{{ item }}"
        wait: true
      loop: "{{ nat_gateway_ids | default([]) }}"
      when: (nat_gateway_ids | default([]) | length) > 0

    # ---------------------------------------------------------------------------
    # Release EIPs used by NAT gateways
    # ---------------------------------------------------------------------------
    - name: Release NAT EIPs (if present)
      amazon.aws.ec2_eip:
        state: absent
        allocation_id: "{{ item }}"
      loop: "{{ nat_eip_allocation_ids | default([]) }}"
      when: (nat_eip_allocation_ids | default([]) | length) > 0

    # ---------------------------------------------------------------------------
    # Delete route tables we created (public/private)
    # ---------------------------------------------------------------------------
    - name: Delete route tables created by this project (if present)
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        route_table_id: "{{ item }}"
        state: absent
      loop: "{{ route_table_ids | default([]) }}"
      when: (route_table_ids | default([]) | length) > 0

    # ---------------------------------------------------------------------------
    # Detach & delete IGW
    # ---------------------------------------------------------------------------
    - name: Gather internet gateways attached to VPC
      amazon.aws.ec2_vpc_igw_info:
        filters:
          attachment.vpc-id: "{{ vpc_id }}"
      register: igw_info

    - name: Delete internet gateways attached to VPC
      amazon.aws.ec2_vpc_igw:
        state: absent
        vpc_id: "{{ vpc_id }}"
        igw_id: "{{ item.internet_gateway_id }}"
      loop: "{{ igw_info.internet_gateways | default([]) }}"
      when: (igw_info.internet_gateways | default([]) | length) > 0

    # ---------------------------------------------------------------------------
    # Delete subnets
    # ---------------------------------------------------------------------------
    - name: Delete subnets in VPC (public + private)
      amazon.aws.ec2_vpc_subnet:
        state: absent
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ item.cidr_block }}"
        az: "{{ item.availability_zone }}"
      loop: "{{ subnet_info.subnets }}"
      when: (subnet_info.subnets | length) > 0

    # ---------------------------------------------------------------------------
    # Delete security groups (best-effort)
    # ---------------------------------------------------------------------------
    - name: Delete OpenShift nodes security group (optional)
      amazon.aws.ec2_security_group:
        state: absent
        name: "{{ sg_nodes_name }}"
        vpc_id: "{{ vpc_id }}"
      when: delete_security_groups | bool
      register: sg_nodes_delete
      failed_when: false

    - name: Delete bastion security group (optional)
      amazon.aws.ec2_security_group:
        state: absent
        name: "{{ sg_bastion_name }}"
        vpc_id: "{{ vpc_id }}"
      when: delete_security_groups | bool
      register: sg_bastion_delete
      failed_when: false

    - name: Security group deletion note (if any failed)
      ansible.builtin.debug:
        msg: |
          One or more security groups could not be deleted (often due to ENIs still attached).
          If VPC deletion fails, check for remaining network interfaces / load balancers created by an installer.
      when:
        - delete_security_groups | bool
        - (sg_nodes_delete is defined and sg_nodes_delete.failed) or (sg_bastion_delete is defined and sg_bastion_delete.failed)

    # ---------------------------------------------------------------------------
    # Delete keypair (optional)
    # ---------------------------------------------------------------------------
    - name: Delete EC2 keypair (optional)
      amazon.aws.ec2_key:
        name: "{{ ec2_keypair_name }}"
        state: absent
      when: delete_keypair | bool

    # ---------------------------------------------------------------------------
    # Delete Route 53 hosted zone (optional, best-effort)
    # NOTE: Hosted zone deletion fails if non-default records exist.
    # ---------------------------------------------------------------------------
    - name: Delete Route 53 hosted zone (optional)
      community.aws.route53_zone:
        zone: "{{ route53_zone_name }}"
        state: absent
      when: delete_route53_zone_on_teardown | bool
      register: r53_delete
      failed_when: false

    - name: Route 53 deletion note (if it could not be deleted)
      ansible.builtin.debug:
        msg: |
          Route 53 hosted zone could not be deleted (often because record sets still exist).
          Delete non-default records in the zone, then re-run teardown with delete_route53_zone_on_teardown=true.
      when:
        - delete_route53_zone_on_teardown | bool
        - r53_delete is defined
        - r53_delete.failed

    # ---------------------------------------------------------------------------
    # Finally: delete the VPC
    # ---------------------------------------------------------------------------
    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        state: absent
      register: vpc_deleted

    - name: Teardown summary
      ansible.builtin.debug:
        msg:
          vpc_id: "{{ vpc_id }}"
          deleted_vpc: "{{ vpc_deleted.changed }}"
          deleted_nat_gateways: "{{ nat_gateway_ids | default([]) }}"
          released_eips: "{{ nat_eip_allocation_ids | default([]) }}"
          deleted_route_tables: "{{ route_table_ids | default([]) }}"
          deleted_subnets: "{{ subnet_ids | default([]) }}"
