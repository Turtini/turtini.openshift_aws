- name: Create AWS foundation for OpenShift (VPC/Subnets/NAT/SG/Keypair/DNS)
  hosts: localhost
  connection: local
  gather_facts: false

  # -----------------------------------------------------------------------------
  # Purpose
  # This playbook creates the AWS "foundation" primitives used by an OpenShift
  # installer or subsequent provisioning tasks:
  # - VPC + subnets (public/private)
  # - Internet Gateway + route tables
  # - NAT Gateway (costs money while running)
  # - Security groups (conservative baseline)
  # - Optional: Route 53 hosted zone
  #
  # Safety notes
  # - NAT Gateways incur hourly + data processing charges.
  # - Bastion SSH should NEVER default to 0.0.0.0/0 in a public repo.
  #   Require an explicit operator-provided CIDR if bastion is enabled.
  # -----------------------------------------------------------------------------

  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"

  tasks:
    # ---------------------------------------------------------------------------
    # VPC
    # ---------------------------------------------------------------------------
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        dns_support: true
        dns_hostnames: true
        tags: "{{ common_tags | combine({'Name': vpc_name}) }}"
        state: present
      register: vpc_out

    - name: Set VPC ID fact
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_out.vpc.id }}"

    # ---------------------------------------------------------------------------
    # Internet Gateway (public egress for public subnets)
    # ---------------------------------------------------------------------------
    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        state: present
        tags: "{{ common_tags | combine({'Name': project_name ~ '-igw'}) }}"
      register: igw_out

    # ---------------------------------------------------------------------------
    # Subnets
    # ---------------------------------------------------------------------------
    - name: Create public subnets (map_public_ip_on_launch=true)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        az: "{{ item.az }}"
        cidr: "{{ item.cidr }}"
        map_public: true
        state: present
        tags: "{{ common_tags | combine({'Name': item.name, 'Tier': 'public'}) }}"
      loop: "{{ public_subnets }}"
      register: public_subnet_out

    - name: Create private subnets (no public IPs)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        az: "{{ item.az }}"
        cidr: "{{ item.cidr }}"
        map_public: false
        state: present
        tags: "{{ common_tags | combine({'Name': item.name, 'Tier': 'private'}) }}"
      loop: "{{ private_subnets }}"
      register: private_subnet_out

    - name: Collect subnet IDs
      ansible.builtin.set_fact:
        public_subnet_ids: "{{ public_subnet_out.results | map(attribute='subnet.id') | list }}"
        private_subnet_ids: "{{ private_subnet_out.results | map(attribute='subnet.id') | list }}"

    # ---------------------------------------------------------------------------
    # NAT Gateway (required for private subnet egress)
    # NAT must live in a PUBLIC subnet.
    # ---------------------------------------------------------------------------
    - name: Allocate EIP for NAT Gateway
      amazon.aws.ec2_eip:
        state: present
        in_vpc: true
        tags: "{{ common_tags | combine({'Name': project_name ~ '-nat-eip'}) }}"
      register: nat_eip

    - name: Create NAT Gateway in first public subnet (wait until available)
      amazon.aws.ec2_vpc_nat_gateway:
        state: present
        subnet_id: "{{ public_subnet_ids[0] }}"
        allocation_id: "{{ nat_eip.allocation_id }}"
        wait: true
        tags: "{{ common_tags | combine({'Name': nat_gateway_name}) }}"
      register: natgw_out

    - name: Set NAT Gateway ID fact (module output differs by version)
      ansible.builtin.set_fact:
        nat_gateway_id: "{{ natgw_out.nat_gateway_id | default(natgw_out.nat_gateway.id, true) }}"

    # ---------------------------------------------------------------------------
    # Route tables
    # ---------------------------------------------------------------------------
    - name: Create public route table (default route to IGW) + associate to public subnets
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        tags: "{{ common_tags | combine({'Name': project_name ~ '-rtb-public'}) }}"
        subnets: "{{ public_subnet_ids }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw_out.gateway_id }}"
        state: present

    - name: Create private route table (default route to NAT) + associate to private subnets
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        tags: "{{ common_tags | combine({'Name': project_name ~ '-rtb-private'}) }}"
        subnets: "{{ private_subnet_ids }}"
        routes:
          - dest: 0.0.0.0/0
            nat_gateway_id: "{{ nat_gateway_id }}"
        state: present

    # ---------------------------------------------------------------------------
    # Key pair
    # NOTE: In many orgs, key material should NOT be printed to stdout/logs.
    # Keep this behavior for demos, but make it obvious.
    # ---------------------------------------------------------------------------
    - name: Create/ensure EC2 key pair exists (creates a new one if absent)
      amazon.aws.ec2_key:
        name: "{{ ec2_keypair_name }}"
        state: present
        key_type: rsa
        tags: "{{ common_tags | combine({'Name': ec2_keypair_name}) }}"
      register: keypair_out

    - name: Display key material if key was created now (DEMO ONLY - save securely)
      ansible.builtin.debug:
        msg: |
          A new keypair was created. Save this private key securely:
          {{ keypair_out.key.private_key }}
      when: keypair_out.changed and (keypair_out.key.private_key is defined)

    # ---------------------------------------------------------------------------
    # Security groups
    # Conservative baseline:
    # - Node SSH limited to VPC CIDR
    # - Bastion optional and must require an operator-specified allowed CIDR
    # ---------------------------------------------------------------------------
    - name: Security group for OpenShift nodes (baseline, conservative)
      amazon.aws.ec2_security_group:
        name: "{{ sg_nodes_name }}"
        description: "Baseline SG for OpenShift nodes"
        vpc_id: "{{ vpc_id }}"
        tags: "{{ common_tags | combine({'Name': sg_nodes_name}) }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ vpc_cidr }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present

    # Recommended vars (defaults.yml):
    # create_bastion_sg: false
    # bastion_ssh_allowed_cidr: ""   # required if create_bastion_sg=true
    - name: Guardrail - require bastion SSH CIDR when bastion SG is enabled
      ansible.builtin.assert:
        that:
          - bastion_ssh_allowed_cidr is defined
          - bastion_ssh_allowed_cidr | length > 0
          - bastion_ssh_allowed_cidr != "0.0.0.0/0"
        fail_msg: >
          Bastion is enabled but bastion_ssh_allowed_cidr is not set safely.
          Set bastion_ssh_allowed_cidr to your office/home public IP CIDR (e.g. 203.0.113.10/32).
      when: create_bastion_sg | default(false) | bool

    - name: Security group for optional bastion (SSH from your allowed CIDR)
      amazon.aws.ec2_security_group:
        name: "{{ sg_bastion_name }}"
        description: "Optional bastion SG"
        vpc_id: "{{ vpc_id }}"
        tags: "{{ common_tags | combine({'Name': sg_bastion_name}) }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ bastion_ssh_allowed_cidr }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      when: create_bastion_sg | default(false) | bool

    # ---------------------------------------------------------------------------
    # Optional: Route 53 hosted zone (demo only)
    # ---------------------------------------------------------------------------
    - name: Optional - create Route 53 hosted zone
      community.aws.route53_zone:
        zone: "{{ route53_zone_name }}"
        state: present
        comment: "Hosted zone for {{ project_name }}"
        tags: "{{ common_tags | combine({'Name': route53_zone_name}) }}"
      when: create_route53_zone | bool

    # ---------------------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------------------
    - name: Output summary
      ansible.builtin.debug:
        msg:
          vpc_id: "{{ vpc_id }}"
          public_subnet_ids: "{{ public_subnet_ids }}"
          private_subnet_ids: "{{ private_subnet_ids }}"
          nat_gateway_id: "{{ nat_gateway_id }}"
          keypair_name: "{{ ec2_keypair_name }}"
          sg_nodes: "{{ sg_nodes_name }}"
          sg_bastion: "{{ sg_bastion_name if (create_bastion_sg | default(false) | bool) else 'disabled' }}"
