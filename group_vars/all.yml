aws_region: us-east-1

# -----------------------------------------------------------------------------
# Project Naming
# Generic public sector / GovCloud-style OpenShift demo
# -----------------------------------------------------------------------------
project_name: govcloud-ocp-demo
vpc_name: "{{ project_name }}-vpc"

# -----------------------------------------------------------------------------
# Networking
# -----------------------------------------------------------------------------
vpc_cidr: "10.0.0.0/16"

azs:
  - us-east-1a
  - us-east-1b

public_subnets:
  - name: "{{ project_name }}-public1"
    az: "{{ azs[0] }}"
    cidr: "10.0.0.0/24"
  - name: "{{ project_name }}-public2"
    az: "{{ azs[1] }}"
    cidr: "10.0.1.0/24"

private_subnets:
  - name: "{{ project_name }}-private1"
    az: "{{ azs[0] }}"
    cidr: "10.0.10.0/24"
  - name: "{{ project_name }}-private2"
    az: "{{ azs[1] }}"
    cidr: "10.0.11.0/24"

# -----------------------------------------------------------------------------
# NAT
# -----------------------------------------------------------------------------
nat_gateway_name: "{{ project_name }}-natgw"

# -----------------------------------------------------------------------------
# EC2 Access
# User should override keypair name per environment
# -----------------------------------------------------------------------------
ec2_keypair_name: "{{ project_name }}-key"

# -----------------------------------------------------------------------------
# Security Groups
# -----------------------------------------------------------------------------
sg_nodes_name: "{{ project_name }}-nodes-sg"
sg_bastion_name: "{{ project_name }}-bastion-sg"

# -----------------------------------------------------------------------------
# Optional Route 53 Hosted Zone (demo only)
# -----------------------------------------------------------------------------
create_route53_zone: false
route53_zone_name: "demo.turtini.com"

# -----------------------------------------------------------------------------
# Tagging
# Designed to align with public sector tagging standards
# -----------------------------------------------------------------------------
common_tags:
  Project: "{{ project_name }}"
  Owner: "platform-team"
  Environment: "demo"
  Expires: "YYYY-MM-DD"   # override at runtime or via inventory

# -----------------------------------------------------------------------------
# Preflight Quota Guidance
# Approximate vCPU needs for a small OpenShift demo cluster
# -----------------------------------------------------------------------------
required_on_demand_vcpus: 32

# -----------------------------------------------------------------------------
# Teardown Safety
# -----------------------------------------------------------------------------
confirm_destroy: false

# Require explicit operator confirmation before teardown
require_typed_confirmation: true
typed_confirmation_value: ""   # override at runtime (recommended)

# -----------------------------------------------------------------------------
# Optional Teardown Toggles
# -----------------------------------------------------------------------------
delete_keypair: false
delete_security_groups: true
delete_route53_zone_on_teardown: false
